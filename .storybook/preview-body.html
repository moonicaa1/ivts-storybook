<!-- Geist Mono (코드용 유지) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
  rel="stylesheet"
/>
<!-- Pretendard (전체 UI 폰트) -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
/>
<style>
  /* ── 폰트 변수 ───────────────────────────────────── */
  :root {
    --font-pretendard: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-geist-sans: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-geist-mono: "Geist Mono", "Cascadia Code", "Fira Code", monospace;
    --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "Geist Mono", "Cascadia Code", "Fira Code", monospace;

    /* ── 타이포그래피 스케일 (Figma 기준) ── */
    --docs-font-size-base: 14px;
    --docs-line-height-base: 1.75;
    --docs-color-text: #111827;
    --docs-color-muted: #6b7280;
    --docs-color-border: #e5e7eb;
    --docs-color-code-bg: #f3f4f6;
    --docs-color-code-text: #1f2937;
    --docs-color-pre-bg: #111827;
    --docs-color-pre-text: #f9fafb;
  }

  body, html {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    touch-action: manipulation;
  }

  /* ── Docs 전체 래퍼 ──────────────────────────────── */
  .sbdocs,
  .sbdocs-wrapper,
  .sbdocs-content,
  .docs-story,
  [class*="prose"] {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif !important;
  }

  /* ── Docs 본문 기본 ──────────────────────────────── */
  .sbdocs-content {
    font-size: var(--docs-font-size-base) !important;
    line-height: var(--docs-line-height-base) !important;
    color: var(--docs-color-text) !important;
    max-width: 780px;
  }

  /* ── 제목 계층 ───────────────────────────────────── */
  .sbdocs-content h1 {
    font-size: 30px !important;
    font-weight: 700 !important;
    letter-spacing: -0.022em !important;
    line-height: 1.2 !important;
    color: #0d1117 !important;
    margin: 0 0 8px 0 !important;
    padding-bottom: 0 !important;
    border-bottom: none !important;
  }

  .sbdocs-content h2 {
    font-size: 20px !important;
    font-weight: 600 !important;
    letter-spacing: -0.014em !important;
    line-height: 1.35 !important;
    color: #111827 !important;
    margin: 40px 0 12px 0 !important;
    padding-bottom: 8px !important;
    border-bottom: 1px solid var(--docs-color-border) !important;
  }

  .sbdocs-content h3 {
    font-size: 15px !important;
    font-weight: 600 !important;
    letter-spacing: -0.006em !important;
    line-height: 1.4 !important;
    color: #111827 !important;
    margin: 28px 0 8px 0 !important;
  }

  .sbdocs-content h4 {
    font-size: 13px !important;
    font-weight: 600 !important;
    letter-spacing: 0 !important;
    line-height: 1.5 !important;
    color: #374151 !important;
    margin: 20px 0 6px 0 !important;
    text-transform: uppercase;
    letter-spacing: 0.06em !important;
  }

  /* ── 본문 단락 ───────────────────────────────────── */
  .sbdocs-content p {
    font-size: 14px !important;
    line-height: 1.75 !important;
    color: #374151 !important;
    margin: 0 0 16px 0 !important;
  }

  /* ── 리스트 ──────────────────────────────────────── */
  .sbdocs-content ul,
  .sbdocs-content ol {
    font-size: 14px !important;
    line-height: 1.75 !important;
    color: #374151 !important;
    margin: 0 0 16px 0 !important;
    padding-left: 24px !important;
  }

  .sbdocs-content li {
    margin-bottom: 4px !important;
  }

  .sbdocs-content li::marker {
    color: var(--docs-color-muted) !important;
  }

  /* ── 인라인 코드 ─────────────────────────────────── */
  .sbdocs-content code:not(pre code) {
    font-family: var(--font-mono) !important;
    font-size: 12.5px !important;
    font-weight: 400 !important;
    background: var(--docs-color-code-bg) !important;
    color: #be185d !important;
    padding: 1.5px 5px !important;
    border-radius: 4px !important;
    border: 1px solid #e5e7eb !important;
    letter-spacing: 0 !important;
    white-space: nowrap;
  }

  /* ── 코드 블록 ───────────────────────────────────── */
  .sbdocs-content pre {
    font-family: var(--font-mono) !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    background: var(--docs-color-pre-bg) !important;
    color: var(--docs-color-pre-text) !important;
    padding: 20px 24px !important;
    border-radius: 8px !important;
    overflow-x: auto !important;
    margin: 16px 0 24px 0 !important;
    border: none !important;
  }

  .sbdocs-content pre code {
    font-family: var(--font-mono) !important;
    background: transparent !important;
    color: inherit !important;
    border: none !important;
    padding: 0 !important;
    font-size: inherit !important;
    white-space: pre !important;
  }

  /* ── 구분선 ──────────────────────────────────────── */
  .sbdocs-content hr {
    border: none !important;
    border-top: 1px solid var(--docs-color-border) !important;
    margin: 36px 0 !important;
  }

  /* ── 링크 ────────────────────────────────────────── */
  .sbdocs-content a {
    color: #2563eb !important;
    text-decoration: none !important;
    font-weight: 500 !important;
  }

  .sbdocs-content a:hover {
    text-decoration: underline !important;
    text-underline-offset: 3px !important;
  }

  /* ── 테이블 ──────────────────────────────────────── */
  .sbdocs-content table {
    font-size: 13px !important;
    border-collapse: collapse !important;
    width: 100% !important;
    margin: 16px 0 24px 0 !important;
  }

  .sbdocs-content thead tr {
    border-bottom: 1.5px solid #d1d5db !important;
  }

  .sbdocs-content th {
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.05em !important;
    text-transform: uppercase !important;
    color: #6b7280 !important;
    padding: 8px 12px !important;
    text-align: left !important;
    background: transparent !important;
  }

  .sbdocs-content td {
    padding: 9px 12px !important;
    font-size: 13px !important;
    color: #374151 !important;
    border-bottom: 1px solid #f3f4f6 !important;
    vertical-align: top !important;
  }

  .sbdocs-content tbody tr:last-child td {
    border-bottom: none !important;
  }

  .sbdocs-content tbody tr:hover td {
    background: #f9fafb !important;
  }

  /* ── blockquote ──────────────────────────────────── */
  .sbdocs-content blockquote {
    border-left: 3px solid #d1d5db !important;
    padding: 4px 16px !important;
    margin: 16px 0 !important;
    color: #6b7280 !important;
    font-style: italic !important;
  }

  /* ── strong / em ─────────────────────────────────── */
  .sbdocs-content strong {
    font-weight: 600 !important;
    color: #111827 !important;
  }

  .sbdocs-content em {
    font-style: italic !important;
    color: #374151 !important;
  }

  /* ── 다크모드 오버라이드 ──────────────────────────── */
  .dark .sbdocs-content,
  html.dark .sbdocs-content {
    color: #e5e7eb !important;
    --docs-color-text: #e5e7eb;
    --docs-color-muted: #9ca3af;
    --docs-color-border: #374151;
    --docs-color-code-bg: #1f2937;
    --docs-color-code-text: #f9fafb;
    --docs-color-pre-bg: #0d1117;
    --docs-color-pre-text: #e5e7eb;
  }

  .dark .sbdocs-content h1,
  .dark .sbdocs-content h2,
  .dark .sbdocs-content h3,
  .dark .sbdocs-content h4 {
    color: #f9fafb !important;
  }

  .dark .sbdocs-content p,
  .dark .sbdocs-content li,
  .dark .sbdocs-content td {
    color: #d1d5db !important;
  }

  .dark .sbdocs-content h2 {
    border-bottom-color: #374151 !important;
  }

  .dark .sbdocs-content hr {
    border-top-color: #374151 !important;
  }

  .dark .sbdocs-content code:not(pre code) {
    background: #1f2937 !important;
    color: #f472b6 !important;
    border-color: #374151 !important;
  }

  .dark .sbdocs-content thead tr {
    border-bottom-color: #4b5563 !important;
  }

  .dark .sbdocs-content th {
    color: #9ca3af !important;
  }

  .dark .sbdocs-content td {
    border-bottom-color: #1f2937 !important;
  }

  .dark .sbdocs-content tbody tr:hover td {
    background: #1f2937 !important;
  }

  .dark .sbdocs-content strong {
    color: #f9fafb !important;
  }
</style>

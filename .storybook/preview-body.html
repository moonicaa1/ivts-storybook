<!-- Geist Sans + Geist Mono (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
  rel="stylesheet"
/>
<style>
  /* ── 폰트 변수 ───────────────────────────────────── */
  :root {
    --font-sans:  "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:  "Geist Mono", "Cascadia Code", "Fira Code", monospace;
    --font-geist-sans: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-geist-mono: "Geist Mono", "Cascadia Code", monospace;
  }

  body, html {
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Docs 래퍼 폰트 통일 ─────────────────────────── */
  .sbdocs,
  .sbdocs-wrapper,
  .sbdocs-content,
  .docs-story,
  [class*="prose"] {
    font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif !important;
  }

  /* ── Docs 본문 기본 ──────────────────────────────── */
  .sbdocs-content {
    font-size: 15px !important;
    line-height: 1.7 !important;
    color: #111 !important;
  }

  /* ── H1 ──────────────────────────────────────────── */
  .sbdocs-content h1 {
    font-family: "Geist", sans-serif !important;
    font-size: 52px !important;
    font-weight: 800 !important;
    letter-spacing: -0.03em !important;
    line-height: 1.05 !important;
    color: #000 !important;
    margin: 0 0 16px 0 !important;
    border-bottom: none !important;
    padding-bottom: 0 !important;
  }

  /* ── H2 ──────────────────────────────────────────── */
  .sbdocs-content h2 {
    font-family: "Geist", sans-serif !important;
    font-size: 30px !important;
    font-weight: 700 !important;
    letter-spacing: -0.02em !important;
    line-height: 1.2 !important;
    color: #000 !important;
    margin: 48px 0 0 0 !important;
    padding-bottom: 12px !important;
    border-bottom: 1px solid #e5e7eb !important;
  }

  /* ── H3 ──────────────────────────────────────────── */
  .sbdocs-content h3 {
    font-family: "Geist", sans-serif !important;
    font-size: 22px !important;
    font-weight: 600 !important;
    letter-spacing: -0.015em !important;
    line-height: 1.3 !important;
    color: #111 !important;
    margin: 36px 0 8px 0 !important;
    border-bottom: none !important;
  }

  /* ── H4 ──────────────────────────────────────────── */
  .sbdocs-content h4 {
    font-family: "Geist", sans-serif !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    letter-spacing: -0.005em !important;
    line-height: 1.4 !important;
    color: #111 !important;
    margin: 24px 0 6px 0 !important;
  }

  /* ── 단락 ────────────────────────────────────────── */
  .sbdocs-content p {
    font-size: 15px !important;
    line-height: 1.7 !important;
    color: #374151 !important;
    margin: 0 0 16px 0 !important;
  }

  /* ── 리스트 ──────────────────────────────────────── */
  .sbdocs-content ul,
  .sbdocs-content ol {
    font-size: 15px !important;
    line-height: 1.7 !important;
    color: #374151 !important;
    margin: 0 0 16px 0 !important;
    padding-left: 24px !important;
  }
  .sbdocs-content li {
    margin-bottom: 4px !important;
  }

  /* ── 인라인 코드 ─────────────────────────────────── */
  .sbdocs-content code:not(pre code) {
    font-family: "Geist Mono", monospace !important;
    font-size: 13px !important;
    background: #f3f4f6 !important;
    color: #be185d !important;
    padding: 2px 5px !important;
    border-radius: 4px !important;
    border: 1px solid #e5e7eb !important;
  }

  /* ── 코드 블록 ───────────────────────────────────── */
  .sbdocs-content pre {
    font-family: "Geist Mono", monospace !important;
    font-size: 13px !important;
    line-height: 1.65 !important;
    background: #0d1117 !important;
    color: #f0f6fc !important;
    padding: 20px 24px !important;
    border-radius: 8px !important;
    overflow-x: auto !important;
    margin: 16px 0 24px 0 !important;
    border: none !important;
  }
  .sbdocs-content pre code {
    font-family: "Geist Mono", monospace !important;
    background: transparent !important;
    color: inherit !important;
    border: none !important;
    padding: 0 !important;
    font-size: inherit !important;
  }

  /* ── 구분선 ──────────────────────────────────────── */
  .sbdocs-content hr {
    border: none !important;
    border-top: 1px solid #e5e7eb !important;
    margin: 40px 0 !important;
  }

  /* ── 링크 ────────────────────────────────────────── */
  .sbdocs-content a {
    color: #2563eb !important;
    text-decoration: underline !important;
    text-underline-offset: 3px !important;
    font-weight: 500 !important;
  }

  /* ── 테이블 ──────────────────────────────────────── */
  .sbdocs-content table {
    font-size: 14px !important;
    border-collapse: collapse !important;
    width: 100% !important;
    margin: 16px 0 24px !important;
    border: 1px solid #e5e7eb !important;
  }
  .sbdocs-content th {
    font-size: 13px !important;
    font-weight: 700 !important;
    color: #111 !important;
    padding: 10px 14px !important;
    text-align: left !important;
    border: 1px solid #e5e7eb !important;
    background: #f9fafb !important;
  }
  .sbdocs-content td {
    padding: 10px 14px !important;
    font-size: 14px !important;
    color: #374151 !important;
    border: 1px solid #e5e7eb !important;
  }
  .sbdocs-content tbody tr:nth-child(odd) td {
    background: #fff !important;
  }
  .sbdocs-content tbody tr:nth-child(even) td {
    background: #f9fafb !important;
  }

  /* ── blockquote ──────────────────────────────────── */
  .sbdocs-content blockquote {
    border-left: 3px solid #d1d5db !important;
    padding: 4px 16px !important;
    margin: 16px 0 !important;
    color: #6b7280 !important;
    font-style: italic !important;
  }

  /* ── strong ──────────────────────────────────────── */
  .sbdocs-content strong {
    font-weight: 700 !important;
    color: #111 !important;
  }

  /* ══ 다크모드 ═══════════════════════════════════════ */
  .dark .sbdocs-content h1,
  html.dark .sbdocs-content h1 { color: #fff !important; }

  .dark .sbdocs-content h2,
  html.dark .sbdocs-content h2 {
    color: #f9fafb !important;
    border-bottom-color: #374151 !important;
  }

  .dark .sbdocs-content h3,
  .dark .sbdocs-content h4,
  html.dark .sbdocs-content h3,
  html.dark .sbdocs-content h4 { color: #f3f4f6 !important; }

  .dark .sbdocs-content p,
  .dark .sbdocs-content li,
  html.dark .sbdocs-content p,
  html.dark .sbdocs-content li { color: #d1d5db !important; }

  .dark .sbdocs-content hr,
  html.dark .sbdocs-content hr { border-top-color: #374151 !important; }

  .dark .sbdocs-content code:not(pre code),
  html.dark .sbdocs-content code:not(pre code) {
    background: #1f2937 !important;
    color: #f472b6 !important;
    border-color: #374151 !important;
  }

  .dark .sbdocs-content th,
  html.dark .sbdocs-content th {
    background: #1f2937 !important;
    color: #f3f4f6 !important;
    border-color: #374151 !important;
  }
  .dark .sbdocs-content td,
  html.dark .sbdocs-content td {
    color: #d1d5db !important;
    border-color: #374151 !important;
  }
  .dark .sbdocs-content tbody tr:nth-child(odd) td { background: #111827 !important; }
  .dark .sbdocs-content tbody tr:nth-child(even) td { background: #1f2937 !important; }

  .dark .sbdocs-content strong,
  html.dark .sbdocs-content strong { color: #f9fafb !important; }
</style>
